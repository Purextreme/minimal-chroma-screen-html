<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimal Chroma Screen</title>
  <style>
    :root {
      --safe-x: 8vw;
      --safe-y: 8vh;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      cursor: none;
    }

    body {
      background: #00ff00;
    }

    body.blue {
      background: #0000ff;
    }

    body.checkerboard {
      background: conic-gradient(#000000 25%, #ffffff 0 50%, #000000 0 75%, #ffffff 0);
      background-size: clamp(80px, 16vmin, 240px) clamp(80px, 16vmin, 240px);
    }

    .crosses {
      --grid-steps: 2;
      --cross-size: min(clamp(56px, 5vw, 160px), calc(42vw / var(--grid-steps)), calc(42vh / var(--grid-steps)), 15vw, 15vh);
      --cross-thickness: min(clamp(5px, 0.45vw, 14px), calc(var(--cross-size) / 10));
      position: fixed;
      inset: var(--safe-y) var(--safe-x);
      pointer-events: none;
    }

    .cross {
      position: absolute;
      width: var(--cross-size);
      height: var(--cross-size);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .cross::before,
    .cross::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: #ffffff;
      transform: translate(-50%, -50%);
    }

    .cross::before {
      width: var(--cross-size);
      height: var(--cross-thickness);
    }

    .cross::after {
      width: var(--cross-thickness);
      height: var(--cross-size);
    }

    .help {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: min(520px, calc(100vw - 48px));
      box-sizing: border-box;
      padding: 18px 22px;
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      font: 18px/1.55 Arial, Helvetica, sans-serif;
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    body.hide-help .help {
      display: none;
    }

    .lock-indicator {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2;
      padding: 18px 26px;
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      font: 28px/1 Arial, Helvetica, sans-serif;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    body.show-lock .lock-indicator {
      display: block;
    }
  </style>
</head>
<body class="blue">
  <div class="help" aria-live="polite">
    F11 全屏拍摄<br>
    点击切换绿色 / 蓝色<br>
    空格：5 / 9 / 25 / 49 个十字 / 棋盘格 / 隐藏<br>
    L 锁定 / 解锁操作<br>
    说明将在 10 秒后自动消失
  </div>

  <div class="lock-indicator" aria-live="polite"></div>

  <div class="crosses" aria-hidden="true"></div>

  <script>
    var crossMode = 0;
    var crossModes = [5, 9, 25, 49, "checkerboard", 0];
    var isLocked = false;
    var lockTimer = 0;

    function renderPattern() {
      var container = document.querySelector(".crosses");
      var mode = crossModes[crossMode];
      container.textContent = "";
      document.body.classList.toggle("checkerboard", mode === "checkerboard");

      if (mode === 0 || mode === "checkerboard") {
        return;
      }

      var gridSize = mode === 5 ? 3 : Math.sqrt(mode);
      container.style.setProperty("--grid-steps", gridSize - 1);
      var fragment = document.createDocumentFragment();

      for (var row = 0; row < gridSize; row += 1) {
        for (var column = 0; column < gridSize; column += 1) {
          if (mode === 5 && (row + column) % 2 !== 0) {
            continue;
          }

          var cross = document.createElement("div");
          cross.className = "cross";
          cross.style.left = (column / (gridSize - 1) * 100) + "%";
          cross.style.top = (row / (gridSize - 1) * 100) + "%";
          fragment.appendChild(cross);
        }
      }

      container.appendChild(fragment);
    }

    renderPattern();

    function showLockIndicator(text) {
      window.clearTimeout(lockTimer);
      document.querySelector(".lock-indicator").textContent = text;
      document.body.classList.add("show-lock");
      lockTimer = window.setTimeout(function () {
        document.body.classList.remove("show-lock");
      }, 3000);
    }

    document.addEventListener("click", function () {
      if (isLocked) {
        return;
      }

      document.body.classList.toggle("blue");
    });

    document.addEventListener("keydown", function (event) {
      if (event.code === "KeyL") {
        event.preventDefault();
        isLocked = !isLocked;
        showLockIndicator(isLocked ? "已锁定" : "已解锁");
        return;
      }

      if (isLocked) {
        event.preventDefault();
        return;
      }

      if (event.code !== "Space") {
        return;
      }

      event.preventDefault();
      crossMode = (crossMode + 1) % crossModes.length;
      renderPattern();
    });

    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    window.setTimeout(function () {
      document.body.classList.add("hide-help");
    }, 10000);
  </script>
</body>
</html>
